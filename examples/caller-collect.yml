name: PR 信息收集
run-name: "PR 信息收集 #${{ github.event.pull_request.number }}"

on:
  # Only read event metadata. Never check out or execute pull-request content here.
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-info-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write trusted event metadata
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require("fs");
            const pr = context.payload.pull_request;
            fs.mkdirSync("pr-info", { recursive: true });
            fs.writeFileSync(
              "pr-info/event.json",
              JSON.stringify({
                repository: `${context.repo.owner}/${context.repo.repo}`,
                number: pr.number,
                title: pr.title,
                head_sha: pr.head.sha,
                event_at: pr.created_at
              })
            );

      - name: Upload trusted PR metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-info
          path: pr-info/event.json
          retention-days: 1
          if-no-files-found: error
