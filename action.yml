name: Course PR Reviewer
description: Fail-closed reusable reviewer and grade writer for course assignment pull requests
author: LiuXiYing

branding:
  icon: check-circle
  color: green

inputs:
  mode:
    description: >-
      review (default) reviews and publishes one PR; grade-reconcile promotes
      PENDING receipts after a real merge; grade-export regenerates reports.
    required: false
    default: review
  config-path:
    description: Path to .github/course-review.yml in the caller repository
    required: true
  students-path:
    description: Path to .github/students.yml in the caller repository
    required: true
  metadata-dir:
    description: Directory containing trusted PR metadata from the triggering workflow
    required: false
    default: pr-info
  github-token:
    description: Ephemeral GITHUB_TOKEN supplied by the caller
    required: true
  merge-token:
    description: >-
      PAT used only to merge approved pull requests. GITHUB_TOKEN cannot merge
      (403 Resource not accessible by integration); without this input auto_merge
      will fail. Falls back to github-token when unset.
    required: false
  glm-api-key:
    description: GLM API key; required when a review provider is glm
    required: false
  gemini-api-key:
    description: Gemini API key; required when a review provider is gemini
    required: false
  since:
    description: For grade-reconcile, only handle receipts submitted at or after this ISO time
    required: false
  only-pr:
    description: For grade-reconcile, only handle this PR number
    required: false
  dry-run:
    description: For grade-reconcile / grade-export, print the plan without writing
    required: false
    default: "false"
  teacher-email:
    description: Deprecated and ignored; email notifications are disabled
    required: false
  smtp-host:
    description: Deprecated and ignored; email notifications are disabled
    required: false
    default: smtp.gmail.com
  smtp-port:
    description: Deprecated and ignored; email notifications are disabled
    required: false
    default: "465"
  smtp-username:
    description: Deprecated and ignored; email notifications are disabled
    required: false
  smtp-password:
    description: Deprecated and ignored; email notifications are disabled
    required: false

outputs:
  decision:
    description: PASS, FAIL, MANUAL_REVIEW, or ERROR
    value: ${{ steps.review.outputs.decision }}
  result-json:
    description: Compact structured review result
    value: ${{ steps.review.outputs.result-json }}
  head_sha:
    description: The reviewed head SHA
    value: ${{ steps.review.outputs.head_sha }}
  grading_mode:
    description: legacy or tiered
    value: ${{ steps.review.outputs.grading_mode }}
  graded_status:
    description: ON_TIME, ON_TIME_CORRECTED, LATE, or AFTER_FINAL_ACCEPT
    value: ${{ steps.review.outputs.graded_status }}
  score:
    description: Awarded points for this assignment, empty when unscored
    value: ${{ steps.review.outputs.score }}
  receipt_status:
    description: PENDING_ACCEPTANCE, FINALIZED, or FAILED
    value: ${{ steps.review.outputs.receipt_status }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"

    - name: Install reviewer
      shell: bash
      env:
        REVIEWER_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$REVIEWER_ACTION_PATH"

    - name: Install local PaddleOCR runtime when enabled
      if: inputs.mode == 'review'
      shell: bash
      env:
        COURSE_REVIEW_CONFIG: ${{ inputs.config-path }}
        REVIEWER_ACTION_PATH: ${{ github.action_path }}
      run: |
        runtime_groups="$(course-pr-reviewer runtime-requirements --config "$COURSE_REVIEW_CONFIG")"
        if [[ " $runtime_groups " == *" ocr "* ]]; then
          python -m pip install --disable-pip-version-check "${REVIEWER_ACTION_PATH}[ocr]"
        fi

    - name: Review and publish pull request result
      id: review
      if: inputs.mode == 'review'
      shell: bash
      env:
        COURSE_REVIEW_CONFIG: ${{ inputs.config-path }}
        COURSE_STUDENTS_CONFIG: ${{ inputs.students-path }}
        PR_INFO_DIR: ${{ inputs.metadata-dir }}
        GH_TOKEN: ${{ inputs.github-token }}
        MERGE_TOKEN: ${{ inputs.merge-token }}
        GLM_API_KEY: ${{ inputs.glm-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
      run: |
        set +e
        course-pr-reviewer review \
          --config "$COURSE_REVIEW_CONFIG" \
          --students "$COURSE_STUDENTS_CONFIG" \
          --metadata-dir "$PR_INFO_DIR" \
          --result-file review-result.json
        review_status=$?

        set -e

        course-pr-reviewer publish \
          --config "$COURSE_REVIEW_CONFIG" \
          --students "$COURSE_STUDENTS_CONFIG" \
          --result-file review-result.json

        exit "$review_status"

    - name: Reconcile interrupted grade records
      if: inputs.mode == 'grade-reconcile'
      shell: bash
      env:
        COURSE_REVIEW_CONFIG: ${{ inputs.config-path }}
        COURSE_STUDENTS_CONFIG: ${{ inputs.students-path }}
        GH_TOKEN: ${{ inputs.github-token }}
        SINCE: ${{ inputs.since }}
        ONLY_PR: ${{ inputs.only-pr }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        args=()
        if [[ -n "$SINCE" ]]; then args+=(--since "$SINCE"); fi
        if [[ -n "$ONLY_PR" ]]; then args+=(--only-pr "$ONLY_PR"); fi
        if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
        course-pr-reviewer grade reconcile \
          --config "$COURSE_REVIEW_CONFIG" \
          --students "$COURSE_STUDENTS_CONFIG" \
          --repository "$GITHUB_REPOSITORY" \
          "${args[@]}"

    - name: Regenerate grade reports
      if: inputs.mode == 'grade-export'
      shell: bash
      env:
        COURSE_REVIEW_CONFIG: ${{ inputs.config-path }}
        COURSE_STUDENTS_CONFIG: ${{ inputs.students-path }}
        GH_TOKEN: ${{ inputs.github-token }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        args=()
        if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        course-pr-reviewer grade export \
          --config "$COURSE_REVIEW_CONFIG" \
          --students "$COURSE_STUDENTS_CONFIG" \
          --repository "$GITHUB_REPOSITORY" \
          "${args[@]}"
