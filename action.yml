name: Course PR Reviewer
description: Fail-closed reusable reviewer for course assignment pull requests
author: LiuXiYing

branding:
  icon: check-circle
  color: green

inputs:
  config-path:
    description: Path to .github/course-review.yml in the caller repository
    required: true
  students-path:
    description: Path to .github/students.yml in the caller repository
    required: true
  metadata-dir:
    description: Directory containing trusted PR metadata from the triggering workflow
    required: false
    default: pr-info
  github-token:
    description: Ephemeral GITHUB_TOKEN supplied by the caller
    required: true
  merge-token:
    description: >-
      PAT used only to merge approved pull requests. GITHUB_TOKEN cannot merge
      (403 Resource not accessible by integration); without this input auto_merge
      will fail. Falls back to github-token when unset.
    required: false
  glm-api-key:
    description: GLM API key; required when a review provider is glm
    required: false
  gemini-api-key:
    description: Gemini API key; required when a review provider is gemini
    required: false
  teacher-email:
    description: Teacher email notified only for MANUAL_REVIEW or ERROR
    required: false
  smtp-host:
    description: SMTP SSL host used for teacher notifications
    required: false
    default: smtp.gmail.com
  smtp-port:
    description: SMTP SSL port used for teacher notifications
    required: false
    default: "465"
  smtp-username:
    description: SMTP login and From address
    required: false
  smtp-password:
    description: SMTP password or app password
    required: false

outputs:
  decision:
    description: PASS, FAIL, MANUAL_REVIEW, or ERROR
    value: ${{ steps.review.outputs.decision }}
  result-json:
    description: Compact structured review result
    value: ${{ steps.review.outputs.result-json }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"

    - name: Install reviewer
      shell: bash
      env:
        REVIEWER_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "$REVIEWER_ACTION_PATH"

    - name: Install local PaddleOCR runtime when enabled
      shell: bash
      env:
        COURSE_REVIEW_CONFIG: ${{ inputs.config-path }}
        REVIEWER_ACTION_PATH: ${{ github.action_path }}
      run: |
        runtime_groups="$(course-pr-reviewer runtime-requirements --config "$COURSE_REVIEW_CONFIG")"
        if [[ " $runtime_groups " == *" ocr "* ]]; then
          python -m pip install --disable-pip-version-check "${REVIEWER_ACTION_PATH}[ocr]"
        fi

    - name: Review and publish pull request result
      id: review
      shell: bash
      env:
        COURSE_REVIEW_CONFIG: ${{ inputs.config-path }}
        COURSE_STUDENTS_CONFIG: ${{ inputs.students-path }}
        PR_INFO_DIR: ${{ inputs.metadata-dir }}
        GH_TOKEN: ${{ inputs.github-token }}
        MERGE_TOKEN: ${{ inputs.merge-token }}
        GLM_API_KEY: ${{ inputs.glm-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        TEACHER_EMAIL: ${{ inputs.teacher-email }}
        SMTP_HOST: ${{ inputs.smtp-host }}
        SMTP_PORT: ${{ inputs.smtp-port }}
        SMTP_USERNAME: ${{ inputs.smtp-username }}
        SMTP_PASSWORD: ${{ inputs.smtp-password }}
      run: |
        set +e
        course-pr-reviewer review \
          --config "$COURSE_REVIEW_CONFIG" \
          --students "$COURSE_STUDENTS_CONFIG" \
          --metadata-dir "$PR_INFO_DIR" \
          --result-file review-result.json
        review_status=$?

        course-pr-reviewer notify \
          --config "$COURSE_REVIEW_CONFIG" \
          --result-file review-result.json
        notify_status=$?
        set -e

        course-pr-reviewer publish \
          --config "$COURSE_REVIEW_CONFIG" \
          --result-file review-result.json

        if [[ "$review_status" -ne 0 ]]; then
          exit "$review_status"
        fi
        exit "$notify_status"
